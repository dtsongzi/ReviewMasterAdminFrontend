name: Deploy ReviewMaster Admin (Develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

# 同一应用只允许一个部署；与主站前端用不同产物名，避免与其它站点共用同名产物冲突
concurrency:
  group: deploy-reviewmaster-admin
  cancel-in-progress: true

env:
  DEPLOY_PATH: '/opt/ReviewMasterAdmin'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck
      - name: Unit tests（接口前缀守卫）
        run: npm test

      - name: Build
        run: npm run build
        env:
          # 后端 API 与主站同源，挂在 /reviewmaster 下（见 .env.production）
          VITE_API_BASE: '/reviewmaster'

      - name: Verify dist assets
        run: |
          set -e
          test -s dist/index.html
          for f in dist/assets/*.js; do node --check "$f"; done
          (cd dist && sha256sum index.html assets/*.js assets/*.css > MANIFEST.sha256)
          echo "dist OK: $(wc -l < dist/MANIFEST.sha256) files verified"

      - name: Package dist
        run: tar czf reviewmaster-admin-dist.tar.gz -C dist .

      - name: Upload artifact to server
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
          R_PORT: ${{ secrets.ECS_PORT }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -O -i /tmp/deploy_key -o StrictHostKeyChecking=no -P "${R_PORT:-22}" reviewmaster-admin-dist.tar.gz "${R_USER}@${R_HOST}:/tmp/"

      - name: Remote deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            STAGE="$(mktemp -d /tmp/rm-admin-XXXXXX)"
            trap 'rm -rf "$STAGE"' EXIT
            tar xzf /tmp/reviewmaster-admin-dist.tar.gz -C "$STAGE"
            (cd "$STAGE" && sha256sum -c MANIFEST.sha256)
            rm -rf "$DEPLOY_PATH"
            mv "$STAGE" "$DEPLOY_PATH"
            trap - EXIT
            rm -f /tmp/reviewmaster-admin-dist.tar.gz
            chmod -R 755 "$DEPLOY_PATH"
            echo "Admin deploy OK: $DEPLOY_PATH"
