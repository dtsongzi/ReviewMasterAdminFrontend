name: Deploy ReviewMaster Admin (Production)

on:
  push:
    branches: [master]
  workflow_dispatch:

# 与测试后台用不同 group 和不同产物名，互不干扰
concurrency:
  group: deploy-reviewmaster-admin-production
  cancel-in-progress: true

env:
  DEPLOY_PATH: '/opt/ReviewMasterAdmin'
  API_BASE: '/reviewmaster'
  ARTIFACT: 'reviewmaster-admin-dist.tar.gz'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck
      - name: Unit tests（接口前缀守卫）
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: ${{ env.API_BASE }}

      - name: Verify dist assets
        run: |
          set -e
          test -s dist/index.html
          for f in dist/assets/*.js; do node --check "$f"; done
          (cd dist && sha256sum index.html assets/*.js assets/*.css > MANIFEST.sha256)
          echo "dist OK: $(wc -l < dist/MANIFEST.sha256) files verified"

      - name: Package dist
        run: tar czf "${{ env.ARTIFACT }}" -C dist .

      - name: Upload artifact to server (resumable)
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
          R_PORT: ${{ secrets.ECS_PORT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          export R_HOST R_USER R_PORT SSH_KEY_PATH=/tmp/deploy_key
          export UPLOAD_RETRIES=3 UPLOAD_TIMEOUT_SEC=420
          bash scripts/upload-artifact.sh "${{ env.ARTIFACT }}" "${{ env.ARTIFACT }}" /tmp

      - name: Remote deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            STAGE="$(mktemp -d /tmp/rm-admin-XXXXXX)"
            trap 'rm -rf "$STAGE"' EXIT
            tar xzf "/tmp/${{ env.ARTIFACT }}" -C "$STAGE"
            (cd "$STAGE" && sha256sum -c MANIFEST.sha256)
            rm -rf "$DEPLOY_PATH"
            mv "$STAGE" "$DEPLOY_PATH"
            trap - EXIT
            rm -f "/tmp/${{ env.ARTIFACT }}"
            chmod -R 755 "$DEPLOY_PATH"
            # 递归 755 后收紧可能存在的 .env（部署产物本不应含 .env，有则必须为 600）
            if [ -f "$DEPLOY_PATH/.env" ]; then chmod 600 "$DEPLOY_PATH/.env"; fi
            # Nginx 静态根同步：CI 产物在 /opt/，站点根在 /www/wwwroot/rongyuestock.com/。
            # 幂等：已是软链则校正指向，不存在则创建；若是真实目录绝不删除/覆盖，仅告警待人工确认。
            WEB_ROOT="/www/wwwroot/rongyuestock.com"
            LINK_NAME="${WEB_ROOT}/ReviewMasterAdmin"
            LINK_TARGET="${DEPLOY_PATH}"
            if [ -L "$LINK_NAME" ]; then
              if [ "$(readlink "$LINK_NAME")" != "$LINK_TARGET" ]; then
                ln -sfn "$LINK_TARGET" "$LINK_NAME"
                echo "软链已校正：$LINK_NAME -> $LINK_TARGET"
              else
                echo "软链已就绪：$LINK_NAME -> $LINK_TARGET"
              fi
            elif [ -e "$LINK_NAME" ]; then
              echo "::warning::【需人工确认】$LINK_NAME 是真实目录（非软链），为避免数据丢失未做任何改动。请人工确认后把内容迁移到 $LINK_TARGET 并改为软链。"
            else
              mkdir -p "$WEB_ROOT"
              ln -s "$LINK_TARGET" "$LINK_NAME"
              echo "软链已创建：$LINK_NAME -> $LINK_TARGET"
            fi
            echo "Production admin deploy OK: $DEPLOY_PATH"
